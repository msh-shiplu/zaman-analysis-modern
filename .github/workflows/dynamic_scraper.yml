name: Half-Hourly DSE Dynamic Scraper

on:
  schedule:
    # Runs every 30 mins between 4:00 AM and 8:30 AM UTC 
    # (Matches 10:00 AM to 2:30 PM Bangladesh Standard Time), Sunday through Thursday
    - cron: '0,30 4-8 * * 0-4'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Dynamic Scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py --type dynamic
